<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Order Form</title>
    <style>
        .wufoo {
            font-family: "Lucida Grande", "Lucida Sans Unicode", Tahoma, sans-serif;
        }
    </style>
</head>
<body>

    <form method="get" action="simpleform.html" class="wufoo">
        <h2>Order Form</h2>

        <p>What would you like to buy?</p>
        <select name="product">
            <option value="A">A</option>
            <option value="B">B (+ 0.5$)</option>
            <option value="C">C (+ 0.5$)</option>
        </select>

        <p>How many would you like to order?</p>
        <input type="radio" name="quantity" value="1" id="quantity-1">
        <label for="quantity-1">1 - $10</label><br>

        <input type="radio" name="quantity" value="2" id="quantity-2">
        <label for="quantity-2">2 - $20</label><br>

        <input type="radio" name="quantity" value="3" id="quantity-3">
        <label for="quantity-3">3 - $25</label><br>

        <p>Name <span style="color: red">*</span></p>
        <input type="text" name="firstname" placeholder="FirstName" size="15" required>
        <input type="text" name="lastname" placeholder="LastName" size="15" required>

        <p>Email</p>
        <input type="text" name="email" size="35">

        <p>Phone Number</p>
        <input type="text" name="phone1" size="5" aria-label="First part of phone number"> -
        <input type="text" name="phone2" size="5" aria-label="Second part of phone number"> -
        <input type="text" name="phone3" size="5" aria-label="Third part of phone number">

        <p><input type="button" name="btSubmit" value="Submit"></p>
    </form>

</body>
</html>
